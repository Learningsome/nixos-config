config_version = 14

[bar]
order = [ "top-bar", "bottom-bar" ]

    [bar.bottom-bar]
    background_opacity = 0.84999998100101948
    center = [ "workspaces" ]
    enabled = true
    end = [ "volume", "brightness", "network", "bluetooth", "privacy" ]
    position = "bottom"
    radius = 20
    reserve_space = false
    shadow = false
    smart_auto_hide = true
    start = [ "cpu", "Spacer_20", "ram", "Spacer_20", "sysmon", "Spacer_20", "temp" ]

    [bar.top-bar]
    background_opacity = 0.84999998100101948
    center = [ "date", "clock", "weather" ]
    end = [ "tray", "notifications", "clipboard", "wallpaper", "wallhaven", "battery", "session" ]
    margin_edge = 5
    margin_ends = 5
    padding = 15
    radius = 20
    shadow = false
    start = [ "media", "audio_visualizer" ]
    thickness = 35
    widget_spacing = 10

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[dock]
background_opacity = 0.84999998100101948
launcher_position = "start"
radius = 20
reserve_space = false
show_dots = true
smart_auto_hide = true

[location]
address = "Moscow, Russia"

[lockscreen]
tint_intensity = 0.29999999329447746

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000008", "lockscreen-widget-0000000000000009" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 720.0
    cx = 853.99993896484375
    cy = 948.00006103515625
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000008]
    box_height = 192.0
    box_width = 448.0
    cx = 1461.5
    cy = 69.5
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "label"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000008.settings]
        background = false
        description = "NixOS, BTW"
        font_family = ""
        title = "RedmiBook 16"

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000009]
    box_height = 256.0
    box_width = 704.0
    cx = 853.49993896484375
    cy = 661.49993896484375
    output = "eDP-1"
    placement_height = 1067.0
    placement_width = 1707.0
    rotation = 0.0
    type = "audio_visualizer"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000009.settings]
        background = false
        bands = 32
        centered = false
        reversed = false
        show_when_idle = true

[plugins]
enabled = [ "noctalia/wallhaven", "kenn/keybind-cheatsheet" ]

[shell]
avatar_path = "/var/lib/AccountsService/icons/sekiro.jpg"
lang = "ru"
niri_overview_type_to_launch_enabled = true
polkit_agent = true

    [shell.greeter_sync]
    auto_sync = true

[theme]
builtin = "Eldritch"
community_palette = "Everforest"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "faithful"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "helix", "kcolorscheme", "kitty", "niri", "qt" ]
    community_ids = [ "discord", "telegram", "neovim", "obsidian", "vscode", "zed", "bat", "fzf", "lazygit" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/nikolaj/Pictures/Wallpapers/wallhaven-n65xv7.jpg"

    [wallpaper.last]
    path = "/home/nikolaj/Pictures/Wallpapers/wallhaven-n65xv7.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/nikolaj/Pictures/Wallpapers/wallhaven-n65xv7.jpg"

[widget.Spacer_20]
type = "spacer"

[widget.audio_visualizer]
color_2 = "secondary"
width = 200

[widget.date]
format = "{:%a, %d %b}"

[widget.lock_keys]
enabled = true

[widget.network]
show_label = false

[widget.notifications]
hide_when_no_unread = true

[widget.session]
custom_image = "/home/nikolaj/Pictures/Session/nixos.svg"

[widget.sysmon]
stat = "gpu_usage"

[widget.tray]
drawer = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"

[widget.weather]
show_condition = false

[widget.workspaces]
active_pill_size = 1.0
style = "minimal"
